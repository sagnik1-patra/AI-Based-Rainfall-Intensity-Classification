project:
  name: AI-Based Rainfall Intensity Classification
  optimization: Particle Swarm Optimization
  pso_method: Binary PSO Feature Selection
dataset:
  filename: rainfall_0.csv
  rows: 62
  rainfall_columns: 43
pso:
  particles: 20
  iterations: 25
  inertia_weight: 0.729
  cognitive_constant: 1.49445
  social_constant: 1.49445
  feature_penalty: 0.01
  best_fitness: 0.9966666666666667
  selected_feature_count: 5
  selected_features:
  - Average_Rainfall
  - Minimum_Rainfall
  - Very_Heavy_Rain_Days
  - Rainfall_Range
  - August_Average_Rainfall
target:
  column: Rainfall_Intensity
  classes:
  - High
  - Low
  - Moderate
models:
  pso_random_forest:
    accuracy: 0.875
    precision: 0.8854166666666667
    recall: 0.875
    f1_score: 0.875
  pso_neural_network:
    accuracy: 0.75
    precision: 0.7366071428571428
    recall: 0.75
    f1_score: 0.7288024475524475
